<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة الأصول الثابتة لمجموعة فنادق سيرينتي</title>
<style>
:root{--bg:#f4f6f9;--c:#fff;--t:#1d2733;--m:#66727f;--b:#dce1e7;--p:#1f4e8c;--ok:#1b7f4d;--wn:#b45309;--bd:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13171c;--c:#1c222a;--t:#e6eaee;--m:#98a2ae;--b:#2e3741;--p:#6ea3e6;--ok:#52c48a;--wn:#f0a64a;--bd:#f08a80}}
:root[data-theme="dark"]{--bg:#13171c;--c:#1c222a;--t:#e6eaee;--m:#98a2ae;--b:#2e3741;--p:#6ea3e6;--ok:#52c48a;--wn:#f0a64a;--bd:#f08a80}
html,body{height:auto;margin:0}
body{background:var(--bg);color:var(--t);font:15px/1.5 Tahoma,Arial,sans-serif;padding:0 14px 40px}
h1{font-size:20px;margin:16px 0 4px}p.s{margin:0 0 14px;color:var(--m);font-size:13px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.k div{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px 12px;color:var(--m);font-size:13px}
.k b{display:block;font-size:24px;color:var(--t)}.k .w b{color:var(--wn)}
nav{display:flex;gap:6px;margin-bottom:12px}
button,input,select{font:inherit;color:var(--t)}
button{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:6px 12px;cursor:pointer}
nav button{flex:1;padding:9px}nav button.on,button.p{background:var(--p);color:#fff;border-color:var(--p)}
button.r{color:var(--bd)}button.x{background:var(--bd);border-color:var(--bd);color:#fff}
input,select{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px 10px;min-width:0}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.bar input{flex:1;min-width:140px}.bar select{flex:2;min-width:160px}
.sc{overflow-x:auto;background:var(--c);border:1px solid var(--b);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--b);vertical-align:middle}
th{color:var(--m);font-size:12px;font-weight:600}tr:last-child td{border-bottom:0}
td.ac{white-space:nowrap}td.ac button{padding:3px 8px;font-size:13px;margin-inline-start:4px}
.g{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--b);color:var(--m)}
.g.o{color:var(--ok);border-color:var(--ok)}.g.w{color:var(--wn);border-color:var(--wn)}
.rm{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.rm h4{margin:0 0 8px;font-size:15px}.rm small{color:var(--m);font-weight:400;margin-inline-start:8px}
.ch{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--b);border-radius:8px;padding:3px 4px 3px 8px;margin:0 0 6px 6px;font-size:13px}
.ch i{color:var(--m);font-style:normal;font-size:11px}.ch button{border:0;padding:0 6px;color:var(--bd);background:none}
.em{color:var(--m);text-align:center;padding:26px 10px}
dialog{background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:12px;width:min(92vw,420px);padding:16px}
dialog h3{margin:0 0 10px}dialog label{display:block;font-size:13px;color:var(--m);margin-bottom:10px}
dialog input,dialog select{display:block;width:100%;box-sizing:border-box;margin-top:4px;font-size:15px}
.bt{display:flex;gap:8px;justify-content:flex-start;margin-top:6px}.h{padding-inline-start:18px;max-height:50vh;overflow:auto;margin:0 0 10px}.h li{margin-bottom:6px;font-size:13px}
#t{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.rc{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px;text-align:center}.rc b{display:block;font-size:22px}.rc span{display:block;color:var(--m);font-size:12px;margin-bottom:8px}.rc button{width:100%}.bar h2{margin:0;flex:1;font-size:18px;align-self:center}
.xt input{margin:0!important;padding:4px 6px;font-size:13px}.xt input[type=checkbox]{width:auto!important;display:inline!important}.xt input.n{width:64px!important}.xt input.rr{width:110px!important}.xt td,.xt th{padding:4px 6px}.xt{margin-top:8px}
.mp{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px;margin-top:10px}.mp label{margin:0!important}
#pr{display:none}
#pr.on{display:block;position:fixed;inset:0;background:#e6e7ea;overflow:auto;z-index:50;padding:calc(14px + env(safe-area-inset-top,0px)) 12px 28px;font-family:Tahoma,Arial,sans-serif;color:#161618;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pr .np{display:flex;gap:8px;max-width:794px;margin:0 auto 12px}
#pr .np button{background:#161618;color:#fff;border-color:#161618}#pr .np button+button{background:#fff;color:#161618;border-color:#c9cbd0}
#pr .pg{max-width:794px;margin:0 auto;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18);border-radius:6px;overflow:hidden}
#pr .ph{background:#161618;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 28px}
#pr .ph img{height:44px;width:auto;display:block}
#pr .ph div{text-align:left}#pr .ph small{display:block;color:#a9aeb5;font-size:12px}#pr .ph b{display:block;font-size:30px;line-height:1.15;font-weight:700}
#pr .pb{padding:22px 28px 10px}
#pr .st{display:flex;gap:10px;margin-bottom:18px}#pr .st div{flex:1;border:1px solid #d9dbe0;border-radius:8px;padding:9px 12px;font-size:12px;color:#6b7078}#pr .st b{display:block;font-size:18px;color:#161618;margin-top:2px}
#pr table{width:100%;border-collapse:collapse;min-width:0}
#pr th{background:#161618;color:#fff;font-weight:600;font-size:13px;padding:9px 12px;text-align:right}
#pr td{padding:9px 12px;font-size:14px;border-bottom:1px solid #e3e5e9;text-align:right;color:#161618}
#pr tr:nth-child(even) td{background:#f5f6f8}#pr .c{text-align:center;width:90px}#pr .m{width:48px}#pr td.m{color:#6b7078}#pr td.c{font-weight:700}#pr tr.tt th{background:#2a2b2f}
#pr .sg{display:flex;gap:30px;margin-top:34px}#pr .sg div{flex:1;border-top:1px solid #9aa0a8;padding-top:6px;font-size:12px;color:#6b7078}
#pr .ft{text-align:center;color:#8b9098;font-size:11px;padding:14px 0 18px}
@page{size:A4;margin:10mm}
@media print{body{background:#fff!important;padding:0}body>*:not(#pr){display:none!important}#pr.on{position:static;background:#fff;padding:0;overflow:visible}#pr .np{display:none}#pr .pg{box-shadow:none;border-radius:0;max-width:none}#pr tr{break-inside:avoid}}
.hd{background:#161618;border-radius:12px;padding:14px 16px;margin:12px 0 14px;display:flex;align-items:center;gap:16px}.hd img{height:40px;width:auto;flex:none}.hd h1{margin:0;font-size:18px;color:#fff}.hd p.s{margin:2px 0 0;color:#a9aeb5}
#lk{position:fixed;inset:0;z-index:100;background:#161618;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}#lk[hidden]{display:none}#lk img{height:48px}#lk input{width:min(280px,80vw);text-align:center;background:#222226;color:#fff;border-color:#3a3b40}#lk h2{margin:8px 0 0;font-size:18px}#lk p{margin:0;color:#a9aeb5}#lk #le{color:#f08a80}
.hb{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}.hb button{background:transparent;color:#fff;border-color:#3a3b40;font-size:12px}
.rm summary{cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;list-style:none}.rm summary::-webkit-details-marker{display:none}.rm summary .sp{margin-inline-start:auto;display:flex;gap:4px}.rm .bd{margin-top:10px}

// طبقة ربط: قاعدة البيانات (Firestore) والتنزيلات خارج Claude
(function () {
  const cfg = window.FIREBASE_CONFIG;
  const dl = {
    save: async ({ filename, data }) => {
      const blob = data instanceof Blob ? data : new Blob([data], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }
  };
  window.claude = { use: async k => (k === 'downloads' ? dl : null) };
  if (!window.firebase || !cfg || !cfg.apiKey || cfg.apiKey === 'PASTE') { window.FB_OFF = true; return; }
  firebase.initializeApp(cfg);
  firebase.firestore().settings({ experimentalAutoDetectLongPolling: true, merge: true });
  // غلاف يحذف القيم undefined (Firestore لا يقبلها)
  window.FBC = n => {
    const c = firebase.firestore().collection(n);
    return {
      doc: id => { const r = c.doc(id); return { set: d => r.set(JSON.parse(JSON.stringify(d))), delete: () => r.delete() }; },
      onSnapshot: (a, b) => c.onSnapshot(a, b)
    };
  };
})();
</script>

  p.innerHTML=`<div class="np"><button class="p" data-x="doprint">🖨 طباعة</button><button data-x="clp">إغلاق</button></div><div class="pg"><div class="ph"><img src="${LOGO}" alt="SRNTY"><div><small>جرد محتويات الغرفة</small><b>${esc(sel)}</b></div></div><div class="pb"><div class="st"><div>التاريخ<b>${fmt(new Date())}</b></div><div>عدد الأصناف<b>${ks.length}</b></div><div>إجمالي القطع<b>${L.length}</b></div></div><table><tr><th class="m">م<th>الصنف<th class="c">العدد</tr>${ks.map((k,i)=>`<tr><td class="m">${i+1}<td>${esc(k)}<td class="c">${g[k].n}</tr>`).join('')}<tr class="tt"><th><th>الإجمالي<th class="c">${L.length}</tr></table><div class="sg"><div>المسؤول</div><div>المراجع</div><div>التوقيع</div></div></div><div class="ft">مجموعة فنادق سيرينتي · إدارة الأصول الثابتة</div></div>`;
  p.classList.add('on');p.scrollTop=0;setTimeout(()=>{try{window.print()}catch(e){}},250);return
 }
 if(x=='xl')return rexp(sel);
 if(x=='rtm')return rtmpl();
 if(x=='rex')return rexp();
 if(x=='rimp')return impRooms();
 if(x=='addr'){const t=A.find(y=>y.id==$('#qa').value);return t?doMove(t,sel):note('اختر الأصل')}
 if(x=='delroom'){
  const r=sel,L=A.filter(y=>!y.mnt&&y.room==r),M=A.filter(y=>y.mnt&&y.from==r).length;
  return ask('حذف الغرفة',[],async()=>{tab='r';await rmMany(L.map(y=>y.id));await delRoom(r);draw();note('تم حذف الغرفة '+r)},1,`<p>سيتم حذف غرفة «${esc(r)}» ${L.length?`<b>مع ${L.length} أصل بداخلها</b> نهائيًا`:'(فارغة)'}، ولا يمكن التراجع.</p>${M?`<p class="s">الأصول المرسلة للصيانة من هذه الغرفة (${M}) لن تُحذف.</p>`:''}`)
 }
 if(x=='addrooms'){
  const f=$('#r1').value.trim(),e=$('#r2').value.trim()||f;if(!f)return note('اكتب رقم الغرفة');
  let L=[];if(/^\d+$/.test(f)&&/^\d+$/.test(e)){const i=+f,j=+e;if(j<i||j-i>=500)return note('نطاق غير صحيح (حتى 500 غرفة)');for(let k=i;k<=j;k++)L.push(String(k))}else L=[f];
  const ex=allRooms();L=L.filter(n=>!ex.includes(n));if(!L.length)return note('هذه الغرف موجودة بالفعل');
  note('تمت إضافة '+L.length+' غرفة');return addRooms(L)
 }
 if(x=='new')return edit();
 if(x=='imp')return imp();
 if(x=='assign'||x=='send'){
  const t=A.find(y=>y.id==$('#qa').value),v=$('#qr').value.trim();
  if(!t||!v)return note(x=='assign'?'اختر الأصل واكتب الغرفة':'اختر الأصل واكتب سبب الصيانة');
  return x=='assign'?doMove(t,v):doMnt(t,v)
 }
 if(a)({edit,move,mnt:toMnt,back,log:histo,del:delA,unas:z=>doMove(z,'')})[x](a)
});
